name: Build Windows installer

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean --windowed --name FXHotkeys --icon assets/icon.ico --add-data "assets;assets" main.py

      - name: Install Inno Setup
        run: choco install innosetup -y
        shell: pwsh

      - name: Compile installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: FXHotkeys-Setup
          path: installer_output/FXHotkeys-Setup.exe
